<!doctype html><meta charset="utf-8"><title>Salon Canlı</title><style>body{margin:0;background:#111}canvas{width:100vw}</style><canvas id="c" width="1920" height="1080"></canvas><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),p=new URLSearchParams(location.search),only=p.has('effects'),strength=+(p.get('strength')||2),img=new Image(); img.src='../../refs/salon.png';
let seed=73519;function rnd(){seed=(1664525*seed+1013904223)>>>0;return seed/4294967296}const dust=Array.from({length:220},()=>[rnd(),rnd(),rnd(),rnd(),rnd()]);
function glow(x,y,r,a){let z=g.createRadialGradient(x,y,0,x,y,r);z.addColorStop(0,`rgba(255,188,92,${a})`);z.addColorStop(1,'rgba(255,188,92,0)');g.fillStyle=z;g.fillRect(x-r,y-r,r*2,r*2)}
window.renderFrame=i=>{let t=(i%240)/239,ph=t*Math.PI*2;if(i%240===239)ph=0;g.globalCompositeOperation='source-over';g.fillStyle=only?'black':'#fafafa';g.fillRect(0,0,1920,1080);g.save();let zoom=1+.0075*(1-Math.cos(ph));g.translate(960,540);g.scale(zoom,zoom);g.translate(-960,-540);if(!only)g.drawImage(img,160,7,1600,1066);g.globalCompositeOperation='screen';
for(let k=0;k<2;k++){let x= k?1595:1110,y=82;g.save();g.filter='blur(22px)';let z=g.createLinearGradient(x,y,x,1080);z.addColorStop(0,`rgba(255,185,88,${.17*strength*(1+.15*Math.sin(ph))})`);z.addColorStop(1,'rgba(255,180,70,0)');g.fillStyle=z;g.beginPath();g.moveTo(x,y);g.lineTo(x-370,1080);g.lineTo(x+240,1080);g.closePath();g.fill();g.restore();glow(x,y,65,.45*strength*(.8+.12*Math.sin(3*ph)+.08*Math.sin(7*ph+.3)));}
for(let [a,b,d,e,f] of dust){let y=130+b*880+25*Math.sin(ph+e*6.28),src=a<.5?1110:1595,x=src+(d-.5)*(y-82)*.55+15*Math.sin(ph+f*6.28);let edge=Math.max(0,1-Math.abs(x-src)/((y-82)*.32));glow(x,y,2+f*5,Math.min(.95,edge*(.3+.5*e)*strength));}
g.save();g.filter='blur(35px)';for(let n=0;n<9;n++){let x=n*250+65*Math.sin(ph+n),y=990+30*Math.sin(ph+n*.8);g.save();g.translate(x,y);g.scale(3.8,.35);glow(0,0,150,.045*strength);g.restore()}g.restore();g.restore();};
window.captureFrame=(i,m='image/png',q=.95)=>{renderFrame(i);return c.toDataURL(m,q)};window.READY=new Promise(r=>img.onload=()=>{renderFrame(0);r({frames:240,fps:30,width:1920,height:1080,renderer:'canvas',title:'Salon Canlı'})});if(!p.has('capture'))READY.then(()=>{let start=performance.now();function play(now){renderFrame(Math.floor((now-start)*.03));requestAnimationFrame(play)}requestAnimationFrame(play)});
</script>
